security:
  password_hashers:
    App\Entity\Usuario:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Entity\Usuario
        property: username

  firewalls:
    # firewall para el entorno dev (opcional, típico en proyectos Symfony)
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # LOGIN: recibe username/password y devuelve JWT
    login:
      pattern: ^/login
      stateless: true
      json_login:
        check_path: /login
        username_path: username
        password_path: password
        success_handler: lexik_jwt_authentication.handler.authentication_success
        failure_handler: lexik_jwt_authentication.handler.authentication_failure

    # Rutas protegidas por JWT
    api:
      # Aquí incluyes todas las rutas que quieras proteger con token
      pattern: ^/auth
      stateless: true
      jwt: ~

  access_control:
    # 1) Permitir acceso público al login (obtener token)
    - { path: ^/login, roles: PUBLIC_ACCESS }

    # 2) Permitir acceso público al registro de usuarios
    - { path: ^/auth/registro, roles: PUBLIC_ACCESS }

    # 3) Permitir acceso público a la introspección de tokens
    #    (ya que el token viene en el body, no en el Authorization header)
    - { path: ^/auth/token-introspeccion, roles: PUBLIC_ACCESS }

    # 4) Rutas bajo /auth que SÍ requieren estar autenticado con JWT
    #    (usuario-logueado, usuario_find, y cualquier otra que agregues)
    - { path: ^/auth, roles: IS_AUTHENTICATED_FULLY }